internal_name: gpt-5.6-terra
provider: opencode_auth
authentication_mode: chatgpt_subscription_oauth

# OpenCode's built-in Codex OAuth plugin resolves this model without an API key.
agent_specific:
  opencode:
    provider_name: openai
    model: gpt-5.6-terra
    thinking_enabled: true
    config:
      "$schema": "https://opencode.ai/config.json"

cost_accounting:
  actual_billed_cost: subscription_included
  estimated_api_equivalent_cost: catalog_pricing

pricing:
  source: https://developers.openai.com/api/docs/models/gpt-5.6-terra
  effective_date: 2026-08-17
  # Prompts above 272k input tokens use 2x input and 1.5x output pricing.
  input: 4.00
  output: 18.00
  cache_read: 0.40
  cache_write: 5.00
  prompt_tiers:
    - max_input_tokens: 272000
      input: 2.00
      output: 12.00
      cache_read: 0.20
      cache_write: 2.50
