internal_name: gpt-6-astra
provider: openai
provider_slugs:
  openai-codex: gpt-6-astra

# Use --model opencode_auth/gpt-6-astra to drive via a ChatGPT Codex
# subscription (OpenCode's built-in Codex OAuth plugin).
agent_specific:
  opencode:
    provider_name: openai
    model: gpt-6-astra
    thinking_enabled: true
    config:
      "$schema": "https://opencode.ai/config.json"

pricing:
  source: https://developers.openai.com/api/docs/models/gpt-6-astra
  effective_date: 2026-09-05
  # Prompts above 272k input tokens use 2x input/cache and 1.5x output pricing.
  input: 20.00
  output: 75.00
  cache_read: 2.00
  cache_write: 25.00
  prompt_tiers:
    - max_input_tokens: 272000
      input: 10.00
      output: 50.00
      cache_read: 1.00
      cache_write: 12.50
